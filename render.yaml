services:
  - type: web
    name: huydebug-spa
    env: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: TOKEN_SECRET
        generateValue: true
    disk:
      name: spa-data
      mountPath: /opt/render/project/src/server/storage
      sizeGB: 1
