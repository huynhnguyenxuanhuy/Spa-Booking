<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Spa Booking</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

<style>
*{box-sizing:border-box;font-family:Segoe UI}
body{margin:0;background:#f1f5f9}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:#0f172a;color:#fff;padding:20px}
.sidebar h2{color:#38bdf8}
.sidebar div{padding:10px;border-radius:8px;cursor:pointer}
.sidebar div:hover{background:#1e293b}
.main{padding:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.card{background:#fff;padding:20px;border-radius:16px}
.form{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.form input,.form select,.form button{padding:10px;border:none;border-radius:10px}
.form button{background:#38bdf8;color:#fff}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.day{background:#fff;padding:10px;border-radius:12px;min-height:100px}
.event{background:#38bdf8;color:#fff;padding:4px 6px;border-radius:6px;margin-top:4px;font-size:12px;display:flex;justify-content:space-between}
.del{cursor:pointer}
.auth{max-width:360px;margin:100px auto;background:#fff;padding:24px;border-radius:20px}
.auth input,.auth button{width:100%;padding:12px;margin-bottom:10px}
.auth button{background:#38bdf8;color:#fff;border:none}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;
const API = "https://spa-api.onrender.com";

/* ===== LOGIN ===== */
function DangNhap({ ok, sangDangKy }) {
  const [taiKhoan, setTK] = useState("");
  const [matKhau, setMK] = useState("");

  const login = () => {
    fetch(API+"/login",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ taiKhoan, matKhau })
    })
    .then(r=>r.json())
    .then(d=> d.ok ? ok() : alert("Sai tài khoản"));
  };

  return (
    <div className="auth">
      <h2>Đăng nhập</h2>
      <input placeholder="Tài khoản" onChange={e=>setTK(e.target.value)} />
      <input type="password" placeholder="Mật khẩu" onChange={e=>setMK(e.target.value)} />
      <button onClick={login}>Đăng nhập</button>
      <p onClick={sangDangKy} style={{cursor:"pointer"}}>Đăng ký</p>
    </div>
  );
}

/* ===== REGISTER ===== */
function DangKy({ ve }) {
  const [taiKhoan, setTK] = useState("");
  const [matKhau, setMK] = useState("");

  const reg = () => {
    fetch(API+"/register",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ taiKhoan, matKhau })
    })
    .then(r=>r.json())
    .then(d=> d.ok ? (alert("OK"), ve()) : alert("Trùng tài khoản"));
  };

  return (
    <div className="auth">
      <h2>Đăng ký</h2>
      <input placeholder="Tài khoản" onChange={e=>setTK(e.target.value)} />
      <input type="password" placeholder="Mật khẩu" onChange={e=>setMK(e.target.value)} />
      <button onClick={reg}>Đăng ký</button>
    </div>
  );
}

/* ===== DASHBOARD ===== */
function TrangChinh({ out }) {
  const dsNhanVien = ["Hoàng","Nhật","Bảo","Tân","Vĩnh Tài"];
  const [dsLich, setDsLich] = useState([]);
  const [form, setForm] = useState({ nhanVien:"", dichVu:"", ngay:"", gio:"" });

  useEffect(()=>{
    fetch(API+"/lich").then(r=>r.json()).then(setDsLich);
  },[]);

  const them = () => {
    fetch(API+"/lich",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(form)
    }).then(()=>fetch(API+"/lich").then(r=>r.json()).then(setDsLich));
  };

  const xoa = id => {
    fetch(API+"/lich/"+id,{ method:"DELETE" })
      .then(()=>fetch(API+"/lich").then(r=>r.json()).then(setDsLich));
  };

  const d = new Date(), y=d.getFullYear(), m=d.getMonth();
  const days = new Date(y,m+1,0).getDate();

  return (
    <div className="layout">
      <div className="sidebar">
        <h2>ĐẶT LỊCH SPA</h2>
        <div>Trang chủ</div>
        <div onClick={out}>Đăng xuất</div>
      </div>

      <div className="main">
        <div className="stats">
          <div className="card">Tổng lịch: {dsLich.length}</div>
          <div className="card">Nhân viên: {dsNhanVien.length}</div>
          <div className="card">Tháng này</div>
        </div>

        <div className="form">
          <select onChange={e=>setForm({...form,nhanVien:e.target.value})}>
            <option>Nhân viên</option>
            {dsNhanVien.map(n=><option key={n}>{n}</option>)}
          </select>
          <input placeholder="Dịch vụ" onChange={e=>setForm({...form,dichVu:e.target.value})}/>
          <input type="date" onChange={e=>setForm({...form,ngay:e.target.value})}/>
          <input type="time" onChange={e=>setForm({...form,gio:e.target.value})}/>
          <button onClick={them}>Thêm</button>
        </div>

        <div className="calendar">
          {[...Array(days)].map((_,i)=>{
            const day=i+1;
            const key=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
            return (
              <div className="day" key={day}>
                <b>{day}</b>
                {dsLich.filter(l=>l.ngay===key).map(l=>(
                  <div className="event" key={l._id}>
                    <span>{l.gio} - {l.nhanVien}</span>
                    <span className="del" onClick={()=>xoa(l._id)}>❌</span>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [m,setM]=useState("login");
  return m==="login"
    ? <DangNhap ok={()=>setM("home")} sangDangKy={()=>setM("reg")}/>
    : m==="reg"
    ? <DangKy ve={()=>setM("login")}/>
    : <TrangChinh out={()=>setM("login")}/>
}

ReactDOM.createRoot(root).render(<App/>);
</script>
</body>
</html>
